    <!-- Active tab visual highlight logic -->
    <script>
        const links = document.querySelectorAll('.kb-link');
        const activeClasses = ['bg-brand-50', 'dark:bg-slate-700', 'text-brand-700', 'dark:text-brand-300', 'font-bold', 'border-brand-500', 'shadow-sm'];
        const inactiveClasses = ['text-slate-600', 'dark:text-slate-400', 'border-transparent', 'hover:bg-slate-100', 'dark:hover:bg-slate-700/50', 'hover:text-slate-900', 'dark:hover:text-slate-200'];

        links.forEach(link => {
            link.addEventListener('click', function() {
                // Remove active class from all links
                links.forEach(l => {
                    l.classList.remove(...activeClasses);
                    l.classList.add(...inactiveClasses);
                });

                // Highlight clicked link
                this.classList.remove(...inactiveClasses);
                this.classList.add(...activeClasses);

                // Close mobile sidebar if open
                document.getElementById('sidebar').classList.add('-translate-x-full');
            });
        });

        // Mobile drawer handlers
        document.getElementById('openSidebarMobile').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('-translate-x-full');
        });
        document.getElementById('closeSidebarMobile').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('-translate-x-full');
        });

        // Dark theme toggle handler
        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });
    </script>
